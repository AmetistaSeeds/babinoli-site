<body class="">
<main class="pagina">
<header class="topo"><a href="../en/index.html" aria-label="Home"><img class="logo" src="../img/logo.png" alt="Babi Noli"></a><a class="voltar" href="../en/index.html">Home</a></header><article class="conteudo">
<h1>Contact</h1>
<p class="sub">Want to get in touch? Write here — I reply by email, usually within a few days.</p>
<form id="cform" class="cform" novalidate>
<label class="f">Your name (optional)<input type="text" name="name" maxlength="120" autocomplete="name"></label>
<label class="f">Your email<input type="email" name="email" required maxlength="200" autocomplete="email" inputmode="email"></label>
<label class="f">Message<textarea name="message" required maxlength="5000" rows="7"></textarea></label>
<label class="hp" aria-hidden="true">Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
<p><button type="submit" class="enviar">Send message</button></p>
<p class="status" id="cst" role="status" aria-live="polite"></p>
</form>
<p class="sub">I use your name, email and message only to reply. More details in <a href="privacy.html">Privacy</a>. Email: <a href="mailto:contato@babinoli.com">contato@babinoli.com</a></p>
<style>.cform{display:grid;gap:14px;margin:1.5rem 0}.cform .f{display:grid;gap:6px}.cform input,.cform textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:inherit}.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.cform .enviar{font:inherit;padding:10px 22px;border-radius:999px;border:0;background:var(--botao,#9D3D3C);color:#fff;cursor:pointer}.cform .enviar:disabled{opacity:.6}.cform .status{min-height:1.4em}</style>
<script>
(function(){var f=document.getElementById("cform"),s=document.getElementById("cst"),t0=Date.now(),FAIL='Could not send right now. Please try again in a few minutes or write to contato@babinoli.com.';
f.addEventListener("submit",function(e){e.preventDefault();var d=Object.fromEntries(new FormData(f));
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email||"")||!(d.message||"").trim()){s.textContent='Please enter a valid email and a message.';return;}
d.ms=Date.now()-t0;d.lang="en";d.page=location.href;var b=f.querySelector("button");b.disabled=true;s.textContent='Sending…';
fetch("/api/contato",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)}).then(function(r){
if(r.ok){f.reset();s.textContent='Message sent. Thank you! I will reply to the email you gave.';}else{s.textContent=FAIL;b.disabled=false;}
}).catch(function(){s.textContent=FAIL;b.disabled=false;});});})();
</script>
