<meta property="og:title" content="Babi Noli">

<style>
:root{--creme:#F4EAD2;--areia:#EAC8A2;--vermelho:#9D3D3C;--azul:#1D4C80;--nevoa:#D9D3CB;--marrom:#241713;--marrom-suave:#5a4a42}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--creme);color:var(--marrom);font-family:Poppins,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100%;padding:clamp(28px,6vh,64px) 20px 28px}
header{text-align:center}
header img{width:min(300px,70vw);height:auto;display:block;margin:0 auto}
header p{font-family:Lora,Georgia,serif;font-style:italic;font-size:1.15rem;margin-top:18px;color:var(--marrom-suave)}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:clamp(24px,5vw,64px);margin-top:clamp(32px,6vh,52px);width:100%;justify-content:center;flex:1;align-content:start}
.caminho{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;outline:none}
.porta{position:relative;width:100%;aspect-ratio:220/310;perspective:900px}
.porta svg{position:absolute;inset:0;width:100%;height:auto;overflow:visible}
.folha{transform-origin:9.1% 50%;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.caminho:hover .folha,.caminho:focus-visible .folha{transform:rotateY(38deg)}
.caminho:focus-visible .porta{outline:3px solid var(--marrom);outline-offset:8px;border-radius:12px}
.texto h2{font-family:Lora,Georgia,serif;font-weight:600;font-size:1.35rem;margin-top:18px;line-height:1.2}
.texto p{font-size:.88rem;line-height:1.5;margin-top:8px;color:var(--marrom-suave);max-width:27ch;margin-inline:auto}
footer{margin-top:48px;font-size:.78rem;display:flex;gap:22px}
footer a{color:var(--marrom-suave)}
@media (max-width:620px){
 nav{grid-template-columns:1fr;gap:28px;max-width:380px}
 .caminho{flex-direction:row;text-align:left;gap:20px;align-items:center}
 .porta{width:104px;flex:none}
 .texto h2{margin-top:0}.texto p{margin-inline:0}
}
@media (prefers-reduced-motion:reduce){.folha{transition:none}}
</style>
</head>
<body>
